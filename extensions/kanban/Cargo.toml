[package]
name = "kanban"
version = "0.3.0"
edition = "2024"
license = "MIT"
description = "kanban.tartan.rawkode.academy: boards over a repository's issues, with columns, lanes and groups from Issues properties"
publish = false

# Built for wasm32-unknown-unknown by scripts/build-extension.sh, outside the host workspace.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tartan-ext = { path = "../../sdk/rust/tartan-ext" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
