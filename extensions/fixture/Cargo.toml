[package]
name = "tartan-fixture"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A test extension: records the ref events it receives and emits one event for each."
publish = false

# Built for wasm32-unknown-unknown by scripts/build-extension.sh, outside the host workspace.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = "1"
wit-bindgen = { version = "=0.57.1", default-features = false, features = ["macros", "realloc", "std"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
