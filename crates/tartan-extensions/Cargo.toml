[package]
name = "tartan-extensions"
description = "Runs Tartan extensions: WebAssembly components of the tartan:ext world, in wasmtime."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
getrandom = "0.3"
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
ulid.workspace = true
wasmtime = { version = "50", default-features = false, features = ["anyhow", "component-model", "async", "cranelift", "runtime", "std", "parallel-compilation"] }

[dev-dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }

[lints]
workspace = true
