[package]
name = "tartan-devnet"
description = "A local ATProto network for Tartan's development and tests: PLC directory, PDS, authorization server and Jetstream."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "tartan-devnet"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum.workspace = true
base64.workspace = true
cid.workspace = true
clap.workspace = true
getrandom.workspace = true
hex.workspace = true
jacquard-common.workspace = true
jacquard-repo.workspace = true
jose-jwa.workspace = true
jose-jwk.workspace = true
k256.workspace = true
p256.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_ipld_dagcbor.workspace = true
serde_json.workspace = true
sha2.workspace = true
tartan-atproto = { workspace = true, features = ["dev-identity"] }
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
