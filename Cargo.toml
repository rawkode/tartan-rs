[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8.9"
base64 = "0.22"
cuengine = "0.40.6"
glob = "0.3.3"
hex = "0.4"
hmac = "0.12"
object_store = { version = "0.14.2", features = ["aws"] }
oci-client = { version = "0.18.0", default-features = false, features = ["rustls-tls"] }
oci-spec = { version = "0.10.0", default-features = false, features = ["distribution", "image"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rivetkit = "3.0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ulid = "1"
zip = { version = "9.4.2", default-features = false, features = ["deflate"] }
# ATProto identity and signing (design D2 of the atproto-identity change).
# Exact pins: the identity code relies on specific behaviour of these
# releases (panic paths, proof verification, OAuth entry points).
atrium-crypto = "=0.1.3"
cid = "=0.11.3"
clap = { version = "=4.6.7", features = ["derive", "env"] }
gethostname = "=1.1.0"
getrandom = "=0.3.4"
gix = { version = "=0.90.0", default-features = false, features = ["sha1", "blocking-http-transport-reqwest-rust-tls"] }
ipnet = "=2.12.2"
jacquard-common = "=0.12.2"
jacquard-identity = { version = "=0.12.2", features = ["dns"] }
jacquard-oauth = { version = "=0.12.2", default-features = false }
jacquard-repo = "=0.12.2"
jose-jwa = "=0.1.2"
jose-jwk = "=0.1.2"
k256 = "=0.13.4"
keyring = { version = "=4.2.0", default-features = false, features = ["v1"] }
p256 = "=0.13.2"
rivetkit-client = "=3.0.6"
serde_ipld_dagcbor = "=0.6.4"
tokio-tungstenite = { version = "=0.30.0", features = ["rustls-tls-webpki-roots"] }
toml = "=1.2.1"
tower-http = { version = "=0.6.11", features = ["catch-panic"] }
webbrowser = "=1.2.6"
tartan-atproto = { path = "crates/tartan-atproto" }
tartan-identity-api = { path = "crates/tartan-identity-api" }
tartan-config = { path = "crates/tartan-config" }
tartan-extensions = { path = "crates/tartan-extensions" }
tartan-forge = { path = "crates/tartan-forge" }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
